- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant at the University of Chicago, 2023 –
      description:
        - "Advised by Prof. Alexander Ji: Using stellar spectroscopy from the Low Resolution Imaging Spectrometer (LRIS) to constrain stellar metallicities in the dwarf galaxy Segue I. Paper in prep"
    - title: Senior Thesis at Princeton University, 2022 – 2023
      description:
        - "Advised by Prof. Jenny Greene: Determined the initial mass function of a set of early-type galaxies using spectroscopy from the MASSIVE Survey and molecular gas observations from ALMA data."
    - title: International Internship Program (IIP) at Cardiff University, Summer 2022
      description:
        - "Advised by Dr. Timothy Davis: Determined the star formation efficiency for a sample of 13 galaxies using ALMA observations of CO(1-0) emission with results that further the ability to constrain dark matter distributions of these galaxies."
    - title: Junior Independent Research at Princeton University, 2021 – 2022
      description:
        - "Undergraduate Summer Research Program (USRP): Advised by Prof. Elena Murchikova and Prof. Neta Bahcall: Analyzed spectral data from the Neutron Star Interior Composition Explorer (NICER) mission to measure x-ray variability at SgrA* during the S02 star flyby."
    - title: Research and Development Intern at NuMED For Children Inc., Summer 2020
      description:
        - Worked directly with the Head of R&D on NuMED’s international team to develop of a new pediatric cardiac stent design that received FDA approval in December 2021.

